<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vienna Elite Transfers</title>
    <style>
        :root {
            --bg-color: #0c0c0c;
            --card-bg: #161616;
            --text-main: #f0f0f0;
            --text-muted: #a0a0a0;
            --accent: #d4af37;
            --border: #2a2a2a;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: sans-serif; background-color: var(--bg-color); color: var(--text-main); line-height: 1.5; padding: 20px; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid var(--border); padding-bottom: 15px; flex-wrap: wrap; gap: 15px; }
        .logo { font-size: 1.2rem; color: var(--accent); font-weight: bold; }
        .phone-header { color: var(--accent); font-weight: 600; text-decoration: none; font-size: 0.95rem; }
        .lang-switcher button { background: transparent; border: 1px solid var(--border); color: var(--text-muted); padding: 5px 10px; border-radius: 4px; cursor: pointer; }
        .lang-switcher button.active { border-color: var(--accent); color: var(--accent); }
        .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 20px; max-width: 500px; margin: 0 auto; }
        .title { font-size: 1.4rem; margin-bottom: 5px; }
        .subtitle { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 15px; }
        .price-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); }
        .price-val { color: var(--accent); font-weight: bold; }
    </style>
</head>
<body>
    <header>
        <div class="logo">VIENNA ELITE</div>
        <a href="tel:+4368181534660" class="phone-header">+43 681 81534660</a>
        <div class="lang-switcher">
            <button class="active" onclick="setLang('de', event)">DE</button>
            <button onclick="setLang('en', event)">EN</button>
            <button onclick="setLang('ru', event)">RU</button>
        </div>
    </header>
    <div class="card">
        <div class="title" id="t-name">Tesla Transfer</div>
        <div class="subtitle" id="t-car">Tesla Electric Luxury — bis zu 5 Koffer</div>
        <div class="price-row"><span id="l-p1">Flughafentransfer (Вена ⇆ Аэропорт)</span><span class="price-val">€ 85</span></div>
        <div class="price-row"><span id="l-p2">Stundenweise Miete</span><span class="price-val">€ 90 / Std.</span></div>
        <div class="price-row"><span id="l-p3">Wien ➔ Bratislava</span><span class="price-val">€ 190</span></div>
        <div class="price-row"><span id="l-p4">Wien ➔ Budapest</span><span class="price-val">€ 490</span></div>
        <div class="price-row"><span id="l-p5">Wien ➔ Salzburg</span><span class="price-val">€ 590</span></div>
    </div>
    <script>
        const tr = {
            de: { name: "Tesla Transfer", car: "Tesla Electric Luxury — bis zu 5 Koffer", p1: "Flughafentransfer (Вена ⇆ Аэропорт)", p2: "Stundenweise Miete", p3: "Wien ➔ Bratislava", p4: "Wien ➔ Budapest", p5: "Wien ➔ Salzburg" },
            en: { name: "Tesla Transfer", car: "Tesla Electric Luxury — up to 5 suitcases", p1: "Airport Transfer (Vienna ⇆ Airport)", p2: "Hourly Rental", p3: "Vienna ➔ Bratislava", p4: "Vienna ➔ Budapest", p5: "Vienna ➔ Salzburg" },
            ru: { name: "Трансфер на Tesla", car: "Tesla Electric Luxury — до 5 чемоданов", p1: "Трансфер из аэропорта (Вена ⇆ Аэропорт)", p2: "Почасовая аренда", p3: "Вена ➔ Братислава", p4: "Вена ➔ Будапешт", p5: "Вена ➔ Зальцбург" }
        };
        function setLang(lang, e) {
            document.querySelectorAll('.lang-switcher button').forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            document.getElementById('t-name').innerText = tr[lang].name;
            document.getElementById('t-car').innerText = tr[lang].car;
            document.getElementById('l-p1').innerText = tr[lang].p1;
            document.getElementById('l-p2').innerText = tr[lang].p2;
            document.getElementById('l-p3').innerText = tr[lang].p3;
            document.getElementById('l-p4').innerText = tr[lang].p4;
            document.getElementById('l-p5').innerText = tr[lang].p5;
        }
    </script>
</body>
</html>
