<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vienna Transfer — VIP Tesla Model Y Service</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root[data-theme="dark"] {
            --bg-color: #0b0b0b;
            --card-bg: #141414;
            --card-hover: #1c1c1c;
            --text-main: #ffffff;
            --text-muted: #888888;
            --accent: #25d366;
            --accent-hover: #20ba5a;
            --border: #222222;
            --input-bg: #1a1a1a;
        }

        :root[data-theme="light"] {
            --bg-color: #f4f4f6;
            --card-bg: #ffffff;
            --card-hover: #f9f9f9;
            --text-main: #111111;
            --text-muted: #666666;
            --accent: #00a844;
            --accent-hover: #008f3b;
            --border: #dddddd;
            --input-bg: #eeeeee;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: background-color 0.3s, color 0.3s, border-color 0.3s;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            width: 100%;
            max-width: 480px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding: 0 5px;
        }

        .logo-block {
            font-weight: 700;
            letter-spacing: 1px;
            font-size: 1.1rem;
            line-height: 1.2;
        }

        .logo-block span {
            color: var(--text-muted);
            font-weight: 400;
            font-size: 0.9rem;
            display: block;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .icon-btn {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text-main);
            width: 36px;
            height: 36px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
        }

        .phone-badge {
            border: 1px solid var(--border);
            padding: 8px 12px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-main);
            text-decoration: none;
            background: var(--card-bg);
        }

        .lang-switcher {
            display: flex;
            gap: 4px;
        }

        .lang-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 6px 8px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .lang-btn.active {
            border-color: var(--text-main);
            color: var(--text-main);
            background: var(--card-bg);
        }

        .hero-card {
            width: 100%;
            max-width: 480px;
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.85)), url('https://images.unsplash.com/photo-1617788138017-80ad40651399?auto=format&fit=crop&w=800&q=80') center/cover;
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 35px 20px;
            text-align: center;
            margin-bottom: 20px;
            color: #ffffff;
        }

        .hero-card h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .hero-card p {
            color: #dddddd;
            font-size: 0.9rem;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .features-grid {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            font-size: 0.75rem;
            color: #cccccc;
            border-top: 1px solid rgba(255,255,255,0.15);
            padding-top: 15px;
        }

        .feature-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .feature-item span {
            font-weight: 600;
            color: #ffffff;
        }

        .card {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 25px 20px;
            text-align: center;
            margin-bottom: 20px;
        }

        .card h3 {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .price-amount {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .price-sub {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 20px;
        }

        .card-btn {
            display: block;
            width: 100%;
            background-color: var(--accent);
            color: #000000;
            text-decoration: none;
            padding: 14px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.95rem;
            border: none;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .card-btn:hover {
            background-color: var(--accent-hover);
        }

        .secondary-btn {
            display: block;
            width: 100%;
            background-color: transparent;
            border: 1px solid var(--border);
            color: var(--text-main);
            text-decoration: none;
            padding: 13px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.95rem;
            margin-top: 10px;
            cursor: pointer;
        }

        /* Interactive Calculator & Booking Form Styles */
        .interactive-section {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 25px 20px;
            margin-bottom: 20px;
        }

        .interactive-section h3 {
            font-size: 1.2rem;
            margin-bottom: 15px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 14px;
            text-align: left;
        }
